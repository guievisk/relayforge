name: Deploy to Fly.io

# Dispara em todo push na main. Deploya na nuvem, sem depender de CLI local.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group # evita dois deploys simultaneos pisando um no outro
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Sanity check: mostra o formato do DATABASE_URL atual na Fly sem vazar valor.
      # Se aparecer "user=" vazio, o secret esta malformado.
      - name: Inspect DATABASE_URL shape on Fly
        run: |
          flyctl ssh console -a relayforge -C 'sh -c "node -e \"const u=new URL(process.env.DATABASE_URL);console.log(JSON.stringify({user:u.username,host:u.hostname,db:u.pathname,pw_len:u.password.length}))\""' || echo "ssh check failed (app pode estar down) - seguindo"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # release_command no fly.toml roda `npx prisma migrate deploy` (aplica migrations).
      # Depois sobe o codigo novo e escala conforme min_machines_running.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
